<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAGI SYSTEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#00ff41;font-family:'Courier New',monospace;min-height:100vh}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,0.03) 2px,rgba(0,255,65,0.03) 4px);z-index:9999}
.page{display:none}.page.active{display:flex;flex-direction:column;min-height:100vh}

.login-box{margin:auto;padding:50px 40px;text-align:center;background:#0d0d1a;border:1px solid #00ff4133;border-radius:12px;min-width:340px}
.login-box h1{margin-bottom:20px}
.login-box input,.settings-form input{display:block;width:100%;margin:10px 0;padding:12px;background:#0a0a12;border:1px solid #00ff4133;color:#00ff41;font-family:inherit;font-size:.95em;border-radius:6px}
.login-box input:focus,.settings-form input:focus{border-color:#00ff41;outline:none}
.login-box button,.settings-form button,#submit-btn{margin-top:14px;padding:12px 50px;background:transparent;border:2px solid #ff0040;color:#ff0040;font-family:inherit;font-size:1em;cursor:pointer;border-radius:6px;letter-spacing:2px;transition:all .2s}
.login-box button:hover,.settings-form button:hover,#submit-btn:hover{background:#ff0040;color:#0a0a12;box-shadow:0 0 20px #ff004066}
.hint{margin-top:12px;color:#00ff4177;font-size:.85em;cursor:pointer}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #00ff4122;background:#0d0d1acc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:100}
.logo{color:#ff0040;font-size:1.3em;letter-spacing:4px;font-weight:bold;cursor:pointer;text-shadow:0 0 10px #ff004044}
.nav-btns{display:flex;gap:14px;align-items:center}
.nav-btn{color:#00ff4199;font-size:.85em;cursor:pointer;transition:color .2s}
.nav-btn:hover{color:#00ff41}

.magi-main{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px;max-width:1100px;margin:0 auto;width:100%}
.units-row{display:flex;gap:16px;margin:20px 0;flex-wrap:wrap;justify-content:center;width:100%}
.unit-card{border:1px solid #00ff4122;background:#0d0d1a;border-radius:8px;padding:16px;flex:1;min-width:250px;max-width:340px;min-height:180px;transition:all .3s}
.unit-card:hover{border-color:#00ff4155;box-shadow:0 0 20px #00ff4111}
.unit-card.melchior{border-top:3px solid #00bfff}
.unit-card.balthasar{border-top:3px solid #ff69b4}
.unit-card.casper{border-top:3px solid #ffd700}
.unit-head{font-weight:bold;font-size:.95em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.unit-body{font-size:.85em;line-height:1.6;color:#b0b0b0;white-space:pre-wrap;word-break:break-word}
.dim{color:#00ff4144}
.thinking{color:#00ff4177;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.decision-approve{color:#00ff41;font-weight:bold}
.decision-deny{color:#ff0040;font-weight:bold}
.decision-abstain{color:#ffd700;font-weight:bold}
.latency{color:#00ff4155;font-size:.78em;margin-top:6px}

.verdict-box{margin:16px 0;padding:20px 50px;border:2px solid;border-radius:10px;font-size:1.6em;text-align:center;transition:all .5s}
.verdict-box.approve{border-color:#00ff41;color:#00ff41;background:#00ff410d;text-shadow:0 0 15px #00ff4133}
.verdict-box.deny{border-color:#ff0040;color:#ff0040;background:#ff00400d;text-shadow:0 0 15px #ff004033}
.verdict-summary{font-size:.4em;color:#00ff4177;margin-top:8px}

.input-area{width:100%;max-width:900px;margin:16px 0 30px}
textarea{width:100%;height:100px;background:#0d0d1a;border:1px solid #00ff4133;color:#00ff41;font-family:inherit;font-size:.95em;padding:14px;border-radius:8px;resize:vertical}
textarea:focus{outline:none;border-color:#00ff41}
#submit-btn:disabled{border-color:#00ff4133;color:#00ff4133;cursor:wait}

.admin-main{padding:30px;max-width:900px;margin:0 auto;width:100%}
.admin-main h2{font-size:1.2em}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #00ff4118;border-radius:6px;margin:6px 0;background:#0d0d1a}
.user-row .name{font-weight:bold}.user-row .role{color:#ffd700;font-size:.85em}
.user-row button{padding:6px 16px;background:transparent;border:1px solid #ff0040;color:#ff0040;font-family:inherit;cursor:pointer;border-radius:4px;font-size:.8em}
.user-row button:hover{background:#ff0040;color:#0a0a12}
.settings-form label{display:block;color:#00ff4199;font-size:.85em;margin:12px 0 4px}

.conv-card{border:1px solid #00ff4118;border-radius:8px;padding:14px;margin:8px 0;background:#0d0d1a;cursor:pointer}
.conv-card:hover{border-color:#00ff4133}
.conv-q{color:#00ff41;font-size:.9em;font-weight:bold}.conv-a{color:#b0b0b0;font-size:.8em;margin-top:6px}
.conv-meta{color:#00ff4144;font-size:.75em;margin-top:4px}

@media(max-width:768px){.units-row{flex-direction:column}.unit-card{max-width:100%}.login-box{min-width:auto;margin:20px}}
</style>
</head>
<body>

<!-- Login -->
<div id="login-page" class="page active">
  <div class="login-box">
    <h1 style="color:#ff0040;text-shadow:0 0 30px #ff0040;font-size:2.8em;letter-spacing:10px">MAGI SYSTEM</h1>
    <p class="hint" style="margin-bottom:24px;color:#00ff4177">MAGNIFICENT UNIVERSAL DEITY INTERFACE</p>
    <input id="lu" placeholder="用户名" autocomplete="username">
    <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doLogin()">登录</button>
    <p class="hint" id="login-err"></p>
    <p class="hint" onclick="toggleReg()">没有账号？注册</p>
  </div>
</div>

<!-- Register -->
<div id="reg-page" class="page">
  <div class="login-box">
    <h1 style="color:#ff0040;font-size:2em;letter-spacing:6px">新用户注册</h1>
    <input id="ru" placeholder="用户名">
    <input id="rp" type="password" placeholder="密码（6位以上）">
    <button onclick="doRegister()">注册</button>
    <p class="hint" id="reg-err"></p>
    <p class="hint" onclick="toggleReg()">← 返回登录</p>
  </div>
</div>

<!-- Main Dialog -->
<div id="main-page" class="page">
  <header class="top-bar">
    <div class="logo" onclick="showPage('main')">MAGI SYSTEM</div>
    <div class="nav-btns">
      <span class="nav-btn" id="btn-admin" style="display:none" onclick="showPage('admin')">👥 管理</span>
      <span class="nav-btn" onclick="showPage('history')">📜 历史</span>
      <span class="nav-btn" onclick="showPage('settings')">⚙ 设置</span>
      <span class="nav-btn" id="user-label"></span>
      <span class="nav-btn" onclick="doLogout()">登出</span>
    </div>
  </header>
  <main class="magi-main">
    <div class="units-row">
      <div class="unit-card melchior">
        <div class="unit-head"><span class="dot" style="background:#00bfff"></span> MELCHIOR-01 · 科学家</div>
        <div class="unit-body" id="result-melchior"><span class="dim">等待提案...</span></div>
      </div>
      <div class="unit-card balthasar">
        <div class="unit-head"><span class="dot" style="background:#ff69b4"></span> BALTHASAR-02 · 母亲</div>
        <div class="unit-body" id="result-balthasar"><span class="dim">等待提案...</span></div>
      </div>
      <div class="unit-card casper">
        <div class="unit-head"><span class="dot" style="background:#ffd700"></span> CASPER-03 · 女人</div>
        <div class="unit-body" id="result-casper"><span class="dim">等待提案...</span></div>
      </div>
    </div>
    <div class="verdict-box" id="verdict" style="display:none">
      <div id="verdict-text"></div>
    </div>
    <div class="input-area">
      <textarea id="question" placeholder="向 MAGI 提交提案... (Ctrl+Enter 提交)"></textarea>
      <button id="submit-btn" onclick="submitQuestion()">提交裁决</button>
    </div>
  </main>
</div>

<!-- Admin -->
<div id="admin-page" class="page">
  <header class="top-bar">
    <div class="logo" onclick="showPage('main')">MAGI SYSTEM</div>
    <div class="nav-btns">
      <span class="nav-btn" onclick="showPage('main')">← 返回</span>
      <span class="nav-btn" id="admin-user-label"></span>
    </div>
  </header>
  <main class="admin-main">
    <h2 style="color:#ff0040;margin-bottom:16px">用户管理</h2>
    <div id="user-list"></div>
    <h2 style="color:#ff0040;margin:24px 0 16px">全局配置</h2>
    <div class="settings-form" id="global-config"></div>
  </main>
</div>

<!-- History -->
<div id="history-page" class="page">
  <header class="top-bar">
    <div class="logo" onclick="showPage('main')">MAGI SYSTEM</div>
    <div class="nav-btns">
      <span class="nav-btn" onclick="exportConvs()">💾 导出JSON</span>
      <span class="nav-btn" onclick="exportConvs('csv')">💾 导出CSV</span>
      <span class="nav-btn" onclick="showPage('main')">← 返回</span>
    </div>
  </header>
  <main class="admin-main">
    <h2 style="color:#ff0040;margin-bottom:16px">对话历史</h2>
    <div id="history-list"></div>
  </main>
</div>

<!-- Settings -->
<div id="settings-page" class="page">
  <header class="top-bar">
    <div class="logo" onclick="showPage('main')">MAGI SYSTEM</div>
    <div class="nav-btns">
      <span class="nav-btn" onclick="showPage('main')">← 返回</span>
    </div>
  </header>
  <main class="admin-main">
    <h2 style="color:#ff0040;margin-bottom:16px">个人设置</h2>
    <div class="settings-form" id="settings-form">
      <label>API Key（留空使用全局配置）</label>
      <input id="s-apikey" type="password" placeholder="sk-...">
      <label>API Base URL（留空使用全局配置）</label>
      <input id="s-apibase" placeholder="https://api.vveai.com/v1">
      <label>Model（留空使用全局配置）</label>
      <input id="s-model" placeholder="deepseek-v4-pro">
      <button onclick="saveSettings()">保存</button>
      <p class="hint" id="settings-msg"></p>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
